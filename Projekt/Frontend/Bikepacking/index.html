      THESIS: A bikepacking setup is a drawing sheet — title block, drawing
      area, schedule of parts. Refuses the rounded card-grid SaaS page the
      category ships and its dark-mode-with-neon opposite.
      OWN-WORLD: White sheet, ink hairlines, zero radii anywhere. Archivo
      signage caps at width 115 for structure; Martian Mono carries every
      measured value. Clay = active and primary, olive = confirmed, alarm =
      error only. Cells abut and share edges; photographs enter as framed,
      captioned plates locked to the module, never as backdrops.
      STORY: This plans the load, not the route. Upload a GPX, describe the
      tour, build the packlist against grams and euros, export the checklist.
      FIRST VIEWPORT: Three stacked signage lines across 7 of 12 columns, each
      on its own ruled row and glossed in mono; a framed portrait plate in the
      remaining 5; a title-block strip along the bottom carrying WHAT / INPUT /
      OUTPUT and the clay action cell at its far end.
      FORM: Brief-pinned architecture/studio drawing sheet, ranked 1 of 7 on
      the grounded list because the brief pinned it; seed key 2de63fb5.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, DESIGN.md, and every shipping raster
      carrying its provenance.
    -->
